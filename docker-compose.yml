services:
  dev:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        USER_UID: "${USER_UID:-1000}"
        USER_GID: "${USER_GID:-1000}"
    image: issue-workflow-dev
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - ~/.gitconfig:/home/dev/.gitconfig:ro
      - claude-auth:/home/dev/.claude
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - GH_TOKEN=${GH_TOKEN}
    working_dir: /workspace

  test:
    image: issue-workflow-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: bash -c "uv sync --frozen && uv run pytest"

  quality:
    image: issue-workflow-dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: bash -c "uv sync --frozen && uv run ruff check --fix . && uv run ruff format . && uv run mypy ."

volumes:
  claude-auth:
